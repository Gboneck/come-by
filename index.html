<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#42315A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Come By" />
    <meta name="application-name" content="Come By" />
    <!-- The game draws under the status bar (viewport-fit=cover) and keeps its UI in the safe area. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="A cozy pixel-art herding game: a blue heeler brings the animals home and the ranch grows into a valley." />
    <!-- The manifest and icons (drawn by the game's sprite code) are added by scripts/pwa.mjs. -->
    <title>Come By</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #42315A; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
